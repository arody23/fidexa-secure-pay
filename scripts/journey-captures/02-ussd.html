<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>FidexaPay — USSD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 390px; height: 844px; overflow: hidden; background: #e9edf2; font-family: Inter, Segoe UI, system-ui, sans-serif; }
    .status { display: flex; justify-content: space-between; padding: 12px 20px; font-size: 9px; font-weight: 600; color: #1d2939; }
    .body { display: flex; align-items: center; height: calc(100% - 90px); padding: 0 16px; }
    .sheet { width: 100%; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 20px 40px rgba(16,41,70,.12); }
    .icon { width: 40px; height: 40px; border-radius: 999px; background: #fff4cc; display: grid; place-items: center; font-size: 18px; }
    h1 { margin-top: 16px; font-size: 16px; color: #182230; }
    p { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #59697b; }
    .pin { margin-top: 16px; border: 1px solid #d6dee8; border-radius: 8px; padding: 12px; font-size: 12px; color: #8a98a8; }
    .actions { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { border-radius: 8px; padding: 12px; text-align: center; font-size: 11px; font-weight: 600; }
    .cancel { background: #edf1f5; color: #516273; }
    .ok { background: #ffcc00; color: #231f00; }
    .hint { padding: 0 24px; text-align: center; font-size: 9px; line-height: 1.45; color: #718096; }
  </style>
</head>
<body>
  <div class="status"><span>10:24</span><span>4G · 86%</span></div>
  <div class="body">
    <div class="sheet">
      <div class="icon">📱</div>
      <h1>Demande Mobile Money</h1>
      <p>Confirmez le paiement de <strong>120 000 CDF</strong> pour FidexaPay avec votre code secret.</p>
      <div class="pin">Code secret</div>
      <div class="actions">
        <div class="btn cancel">Annuler</div>
        <div class="btn ok">Confirmer</div>
      </div>
    </div>
  </div>
  <p class="hint">Fenêtre sécurisée affichée par l'opérateur Mobile Money.</p>
</body>
</html>
