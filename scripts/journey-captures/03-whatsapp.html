<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>FidexaPay — WhatsApp OTP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 390px; height: 844px; overflow: hidden; background: #e8e1d8; font-family: Inter, Segoe UI, system-ui, sans-serif; position: relative; }
    .header { background: #075e54; color: #fff; padding: 20px 16px 12px; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 36px; height: 36px; border-radius: 999px; background: #fff; display: grid; place-items: center; color: #0b3b78; font-weight: 800; font-size: 12px; }
    .name { font-size: 13px; font-weight: 700; }
    .sub { font-size: 9px; color: rgba(255,255,255,.7); }
    .msg { margin: 64px 16px 0; max-width: 92%; background: #fff; border-radius: 12px 12px 12px 0; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .msg p { font-size: 11px; line-height: 1.5; color: #283b3a; }
    .time { margin-top: 4px; text-align: right; font-size: 8px; color: #869895; }
    .composer { position: absolute; left: 12px; right: 12px; bottom: 16px; background: #fff; border-radius: 999px; padding: 12px 16px; font-size: 9px; color: #879594; }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">F</div>
    <div>
      <div class="name">FidexaPay</div>
      <div class="sub">Compte professionnel</div>
    </div>
  </div>
  <div class="msg">
    <p>FidexaPay — votre code d'accès au suivi de commande est <strong>482 731</strong>. Valable 15 minutes. Ne le partagez avec personne.</p>
    <div class="time">10:26 ✓✓</div>
  </div>
  <div class="composer">Message</div>
</body>
</html>
