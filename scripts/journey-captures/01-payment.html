<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, height=844" />
  <title>FidexaPay — Paiement</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 390px; height: 844px; overflow: hidden; background: #f7f9fc; font-family: Inter, Segoe UI, system-ui, sans-serif; }
    .wrap { position: relative; height: 100%; padding: 20px 16px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #0b3b78; font-size: 15px; }
    .mark { width: 28px; height: 28px; border-radius: 8px; background: #0b3b78; }
    .card { margin-top: 20px; border: 1px solid #dce7f3; background: #fff; border-radius: 12px; padding: 16px; }
    .title { font-size: 12px; font-weight: 600; color: #183a60; }
    .amount-box { margin-top: 12px; border-radius: 12px; background: #f1f5f9; padding: 16px; text-align: center; }
    .amount-label { font-size: 10px; color: #6b7f93; }
    .amount { margin-top: 4px; font-size: 28px; font-weight: 700; color: #102f55; }
    .row { margin-top: 12px; display: flex; justify-content: space-between; font-size: 10px; }
    .row span:first-child { color: #71859a; }
    .row span:last-child { color: #183a60; font-weight: 600; }
    .escrow { margin-top: 12px; border: 1px solid #b9d4f1; background: #eef6ff; border-radius: 8px; padding: 12px; font-size: 9px; line-height: 1.45; color: #4c6680; }
    label { display: block; margin-top: 16px; font-size: 10px; font-weight: 600; color: #183a60; }
    .input { margin-top: 4px; border: 1px solid #d5e0eb; border-radius: 8px; padding: 10px 12px; font-size: 10px; color: #71859a; }
    .cta { position: absolute; left: 12px; right: 12px; bottom: 12px; background: #0b3b78; color: #fff; border-radius: 12px; padding: 14px; text-align: center; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><div class="mark"></div>FidexaPay</div>
    <div class="card">
      <div class="title">Détails du paiement</div>
      <div class="amount-box">
        <div class="amount-label">Montant à payer</div>
        <div class="amount">120 000 CDF</div>
      </div>
      <div class="row"><span>Service</span><span>Création d'un logo</span></div>
      <div class="row"><span>Délai</span><span>7 jours</span></div>
      <div class="escrow">Fonds protégés par escrow jusqu'à validation de la livraison.</div>
      <label>Numéro Mobile Money</label>
      <div class="input">+243 8XX XXX XXX</div>
      <label>WhatsApp de suivi</label>
      <div class="input">+243 9XX XXX XXX</div>
    </div>
    <div class="cta">Payer en sécurité</div>
  </div>
</body>
</html>
