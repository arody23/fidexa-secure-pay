<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>FidexaPay — OTP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 390px; height: 844px; overflow: hidden; background: #f3f6f9; font-family: Inter, Segoe UI, system-ui, sans-serif; }
    .wrap { padding: 32px 16px; }
    .logo { text-align: center; font-weight: 700; color: #0b3b78; font-size: 15px; }
    .card { margin-top: 32px; background: #fff; border: 1px solid #dce5ee; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(11,47,99,.04); }
    .head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #183a60; }
    .copy { margin-top: 12px; font-size: 11px; line-height: 1.5; color: #6b7f93; }
    .digits { margin-top: 20px; display: flex; justify-content: space-between; gap: 6px; }
    .digit { width: 36px; height: 40px; border: 1px solid #bfd0e3; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #183a60; }
    .cta { margin-top: 20px; background: #0b3b78; color: #fff; border-radius: 8px; padding: 14px; text-align: center; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">FidexaPay</div>
    <div class="card">
      <div class="head">🔐 Vérification sécurisée</div>
      <p class="copy">Entrez le code OTP envoyé sur WhatsApp (+243 9•• ••• •79).</p>
      <div class="digits">
        <div class="digit">4</div><div class="digit">8</div><div class="digit">2</div>
        <div class="digit">7</div><div class="digit">3</div><div class="digit">1</div>
      </div>
      <div class="cta">Vérifier et accéder</div>
    </div>
  </div>
</body>
</html>
